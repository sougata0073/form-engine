<form [formGroup]="formGroup" [class]="{'with-options': question().rows.length || question().columns.length}">
  <table>
    @if (question().columns.length) {
      <thead>
      <tr>
        <th class="column-label"></th>

        @for (column of question().columns; track column.id) {
          <th class="column-label">{{ column.column }}</th>
        }
      </tr>
      </thead>
    }
    <tbody>
      @for (option of options(); track option.row.id) {
        <tr [formArray]="option.row.formArray">
          <td class="row-label">{{ option.row.row }}</td>
          @for (column of option.columns; track column.id) {
            <td class="checkbox-cell">
              <mat-checkbox
                [value]="column.id"
                [formControl]="column.formControl"
              />
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</form>
