server:
  port: ${SERVER_PORT}

spring:
  devtools:
    restart:
      enabled: true
      poll-interval: 200ms
      quiet-period: 100ms
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
          connection-time-to-live: 900
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      username: ${REDIS_USERNAME}
      database: ${REDIS_DATABASE}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
      timeout: ${REDIS_TIMEOUT}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: Form data service
    description: Form data service to manage form data

app:
  cache:
    default-ttl-minutes: ${CACHE_DEFAULT_TTL_MINUTES}
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS}
    local-data-center: ${CASSANDRA_LOCAL_DATA_CENTER}
    request-timeout-seconds: ${CASSANDRA_REQUEST_TIMEOUT_SECONDS}