server:
  port: ${SERVER_PORT}

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lowerCaseServiceId: true
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origin-patterns:
                  - "*"
                allowed-methods:
                  - "*"
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/users/**

            - id: oauth2-authorization
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/oauth2/authorization/**

            - id: form-data-service
              uri: lb://FORM-DATA-SERVICE
              predicates:
                - Path=/api/v1/form-data/**

            - id: form-response-service
              uri: lb://FORM-RESPONSE-SERVICE
              predicates:
                - Path=/api/v1/form-responses/**

            - id: form-service
              uri: lb://FORM-SERVICE
              predicates:
                - Path=/api/v1/forms/**

            - id: template-service
              uri: lb://FORM-SERVICE
              predicates:
                - Path=/api/v1/templates/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: Gateway service
    description: API Gateway service

app:
  security:
    public-urls:
      - "/api/v1/auth/**"
      - "/oauth2/authorization/**"
      - "/actuator/**"
  cache:
    default-ttl-minutes: ${CACHE_DEFAULT_TTL_MINUTES}
  jwt:
    secret-string: ${JWT_SECRET_STRING}
    expiration-millis: ${JWT_EXPIRATION_MILLIS}