server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 60000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/file-types-data.sql,classpath:db/template/template-categories.sql,classpath:db/template/education-assessment.sql,classpath:db/template/education-blank-quiz.sql,classpath:db/template/education-course-evaluation.sql,classpath:db/template/education-exit-ticket.sql,classpath:db/template/education-worksheet.sql,classpath:db/template/personal-contact-information.sql,classpath:db/template/personal-event-registration.sql,classpath:db/template/personal-find-a-time.sql,classpath:db/template/personal-party-invite.sql,classpath:db/template/personal-rsvp.sql,classpath:db/template/personal-t-shirt-sign-up.sql,classpath:db/template/work-customer-feedback.sql,classpath:db/template/work-event-feedback.sql,classpath:db/template/work-order-request.sql,classpath:db/template/work-time-off-request.sql,classpath:db/template/work-work-request.sql
  devtools:
    restart:
      enabled: true
      poll-interval: 200ms
      quiet-period: 100ms
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      username: ${REDIS_USERNAME}
      database: ${REDIS_DATABASE}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
      timeout: ${REDIS_TIMEOUT}
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
          connection-time-to-live: 900

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: Form service
    description: Form service to manage dynamic form structures

app:
  cache:
    default-ttl-minutes: ${CACHE_DEFAULT_TTL_MINUTES}